spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  devtools:
    add-properties: false

server:
  port: ${PORT}
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
        path: /

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  api-key: ${ADMIN_API_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
