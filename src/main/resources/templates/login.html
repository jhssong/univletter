<!DOCTYPE html>
<html lang="ko">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>UnivLetter</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            margin: auto;
            color: #333;
            line-height: 1.5;
            font-family: AppleSDGothic, apple sd gothic neo, noto sans korean, noto sans korean regular, noto sans cjk kr, noto sans cjk, nanum gothic, malgun gothic, dotum, arial, helvetica, MS Gothic, sans-serif !important;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            cursor: pointer;
        }

        .container {
            background-color: #ffffff;
            border-radius: 5px;
            border: 1px solid #e1e1e1;
            width: 100%;
            margin: 40px 0;
            padding: 0 24px;
        }

        .logo {
            display: block;
            width: 100%;
            height: auto;
            max-width: 200px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            line-height: 1.5;
        }

        .article-divider {
            margin: 24px 0;
            height: 1px;
            background-color: #eee;
        }

        .login-container {
            width: 100%;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #3194CE;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-container button:hover {
            background-color: #2572A9;
        }

        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>
<div class="container">

    <a href="https://univletter.jhssong.com/">
        <img class="logo" src="https://univletter.jhssong.com/logo">
    </a>

    <div class="title">
        <span>로그인</span>
    </div>

    <div class="article-divider"></div>

    <div class="login-container">
        <form method="post" th:action="@{/login}">
            <div class="error-message" th:if="${param.error}">
                아이디 또는 비밀번호가 잘못되었습니다.
            </div>
            <div class="error-message" style="color: #28a745;" th:if="${param.logout}">
                로그아웃 되었습니다.
            </div>
            <input name="username" placeholder="아이디" required type="text">
            <input name="password" placeholder="비밀번호" required type="password">
            <button type="submit">로그인</button>
        </form>
    </div>

    <div class="article-divider"></div>

</div>
</body>

</html>
