<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>UnivLetter Admin Dashboard</title>
    <style>
        body {
            font-family: AppleSDGothic, apple sd gothic neo, noto sans korean, noto sans cjk kr, noto sans cjk, nanum gothic, malgun gothic, dotum, arial, helvetica, MS Gothic, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            min-height: 100vh;
            font-size: 16px;
        }

        /* Sidebar Style */
        .sidebar {
            width: 200px;
            background-color: #282828;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .sidebar .logo-container h1 {
            color: #3194CE;
            font-size: 28px;
            font-weight: bold;
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        .sidebar nav li {
            margin-bottom: 10px;
        }

        .sidebar nav a {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            color: #aaa;
            border-radius: 5px;
            transition: background-color 0.2s, color 0.2s;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background-color: #3194CE;
            color: #ffffff;
            font-weight: bold;
        }

        /* Main Content Style */
        .main-content {
            flex-grow: 1;
            padding: 16px;
            background-color: #F1F1F1;
        }

        .main-content-inner {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 16px;
        }

        .main-content-inner p {
            font-size: 24px;
            font-weight: 500;
            margin: 8px 0 24px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #F1F1F1;
        }

        /* Table Style */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f0f5ff;
        }

        .table-link {
            color: inherit;
            text-decoration: none;
        }

        .table-link:hover {
            cursor: pointer;
        }

        /* Paging Style */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }

        .pagination a {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-decoration: none;
            color: #333;
            background-color: #ffffff;
        }

        .pagination a.active {
            background-color: #3194CE;
            color: #ffffff;
            border-color: #3194CE;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                font-size: 14px;
            }

            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-around;
                padding: 8px 0;
            }

            .sidebar .logo-container {
                display: none;
            }

            .sidebar nav ul {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            .sidebar nav a {
                padding: 8px 12px;

            }

            .main-content {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="logo-container">
        <h1>UnivLetter</h1>
    </div>
    <nav>
        <ul>
            <li><a href="#" onclick="loadContent('articles')"
                   th:classappend="${currentTab == 'articles' ? 'active' : ''}">공지글 목록</a></li>
            <li><a href="#" onclick="loadContent('subscribers')"
                   th:classappend="${currentTab == 'subscribers' ? 'active' : ''}">구독자 목록</a></li>
            <li><a href="#" onclick="loadContent('boards')"
                   th:classappend="${currentTab == 'boards' ? 'active' : ''}">게시판
                정보</a></li>
            <li><a class="logout-button" th:href="@{/logout}">로그아웃</a></li>
        </ul>
    </nav>
</div>

<div class="main-content">
    <div class="main-content-inner" id="dashboard-content">
        <p id="content-title">공지글 목록</p>
        <table id="content-table">
            <thead>
            <tr>
                <th>게시판</th>
                <th>분류</th>
                <th>제목</th>
                <th>작성일</th>
                <th>링크</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <div class="pagination" id="pagination-area">
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var articlesData = /*[[${articles}]]*/[];
    var subscribersData = /*[[${subscribers}]]*/[];
    var boardsData = /*[[${boards}]]*/[];

    var articlesPageInfo = {
        page: /*[[${articlesPage}]]*/ 0,
        totalPages: /*[[${articlesTotalPages}]]*/ 1
    };
    var subscribersPageInfo = {
        page: /*[[${subscribersPage}]]*/ 0,
        totalPages: /*[[${subscribersTotalPages}]]*/ 1
    };
    var boardsPageInfo = {
        page: /*[[${boardsPage}]]*/ 0,
        totalPages: /*[[${boardsTotalPages}]]*/ 1
    };

    var currentTab = "articles";

    function loadContent(tab) {
        currentTab = tab;
        var contentTitle = document.getElementById('content-title');
        var contentTable = document.getElementById('content-table');
        var paginationDiv = document.getElementById('pagination-area');

        contentTable.innerHTML = '';
        paginationDiv.innerHTML = '';

        let dataToShow;
        let pageInfo;
        let headers;
        let rowMapper;

        if (tab === 'articles') {
            contentTitle.innerText = '공지글 목록';
            dataToShow = articlesData;
            pageInfo = articlesPageInfo;
            headers = ['게시판', '분류', '제목', '작성일', '링크'];
            rowMapper = article => `
                    <tr>
                        <td>${article.boardName}</td>
                        <td>${article.boardSubName}</td>
                        <td>${article.title}</td>
                        <td>${article.formattedDate}</td>
                        <td><a href="${article.link}" class="table-link">보기</a></td>
                    </tr>
                `;
        } else if (tab === 'subscribers') {
            contentTitle.innerText = '구독자 목록';
            dataToShow = subscribersData;
            pageInfo = subscribersPageInfo;
            headers = ['이메일', '구독 상태', '가입일'];
            rowMapper = subscriber => `
                    <tr>
                        <td>${subscriber.email}</td>
                        <td>${subscriber.isSubscribed ? '구독 중' : '구독 취소'}</td>
                        <td>${subscriber.subscribedDate}</td>
                    </tr>
                `;
        } else if (tab === 'boards') {
            contentTitle.innerText = '게시판 정보';
            dataToShow = boardsData;
            pageInfo = boardsPageInfo;
            headers = ['게시판 이름', '분류', '링크'];
            rowMapper = board => `
                    <tr>
                        <td>${board.name}</td>
                        <td>${board.subName}</td>
                        <td><a href="${board.link}" class="table-link">보기</a></td>
                    </tr>
                `;
        }

        contentTable.innerHTML = `
                <thead>
                    <tr>
                        ${headers.map(header => `<th>${header}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${dataToShow.map(rowMapper).join('')}
                </tbody>
            `;

        if (pageInfo.totalPages > 1) {
            if (pageInfo.page > 0) {
                paginationDiv.innerHTML += `<a href="/admin/dashboard?tab=${tab}&page=${pageInfo.page - 1}">이전</a>`;
            }
            if (pageInfo.page < pageInfo.totalPages - 1) {
                paginationDiv.innerHTML += `<a href="/admin/dashboard?tab=${tab}&page=${pageInfo.page + 1}">다음</a>`;
            }
        }

        // Update Sidebar active class
        document.querySelectorAll('.sidebar nav a').forEach(link => {
            link.classList.remove('active');
        });
        document.querySelector(`.sidebar nav a[onclick="loadContent('${tab}')"]`).classList.add('active');
    }

    // Load initial contents
    document.addEventListener('DOMContentLoaded', function () {
        const urlParams = new URLSearchParams(window.location.search);
        const initialTab = urlParams.get('tab') || 'articles';
        loadContent(initialTab);
    });
    /*]]>*/
</script>
</body>

</html>
